<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <link rel="stylesheet" href="style2.css">
    </head>

    <body>

        <div class="site">

            <div class="header">
                <div class="logo">Logo</div>
                <div class="site-name">WebSite Name</div>
            </div>

            <div class="nav">
                <div class="home-cell">Home</div>
                <div>Login</div>
                <div>Registration</div>
                <div>Catalogue</div>
                <div>Cart</div>
            </div>

            <div class="body-row">
                <div class="sidebar">
                    <div>CSE</div>
                    <div>ECE</div>
                    <div>EEE</div>
                    <div>CIVIL</div>
                </div>

                <div class="main-content">
                    <div class="login-box">
                        <h2>Login Page</h2>
                        <form>
                            <div class="form-row">
                                <label for="username">User Name:</label>
                                <input type="text" id="username" name="username">
                            </div>
                            <div class="form-row">
                                <label for="password">Passwords:</label>
                                <input type="password" id="password" name="password">
                            </div>
                            <div class="buttons">
                                <button type="submit">Submit</button>
                                <button type="reset">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </body>

</html>
