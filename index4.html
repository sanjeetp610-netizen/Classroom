<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Cart Page</title>
        <link rel="stylesheet" href="cart4.css">
    </head>

    <body>

        <div class="site">

            <div class="header">
                <div class="logo">Logo</div>
                <div class="site-name">Shop</div>
            </div>

            <div class="nav">
                <div class="home-cell">Home</div>
                <div>Login</div>
                <div>Registration</div>
                <div>Catalogue</div>
                <div>Cart</div>
            </div>

            <div class="body-row">
                <div class="sidebar">
                    <div>CSE</div>
                    <div>ECE</div>
                    <div>EEE</div>
                    <div>CIVIL</div>
                </div>

                <div class="main-content">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Book name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Java 2</td>
                                <td>$35.5</td>
                                <td>2</td>
                                <td>$70</td>
                            </tr>
                            <tr>
                                <td>XML bible</td>
                                <td>$40.5</td>
                                <td>1</td>
                                <td>$40.5</td>
                            </tr>
                            <tr class="total-row">
                                <td colspan="3">Total amount</td>
                                <td>$130.5</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </body>

</html>
