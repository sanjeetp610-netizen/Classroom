<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Catalogue Page</title>
        <link rel="stylesheet" href="style3.css">
    </head>

    <body>

        <div class="site">

            <div class="header">
                <div class="logo">Logo</div>
                <div class="site-name">BookStore</div>
            </div>

            <div class="nav">
                <div class="home-cell">Home</div>
                <div>Login</div>
                <div>Registration</div>
                <div>Catalogue</div>
                <div>Cart</div>
            </div>

            <div class="body-row">
                <div class="sidebar">
                    <div>CSE</div>
                    <div>ECE</div>
                    <div>EEE</div>
                    <div>CIVIL</div>
                </div>

                <div class="main-content">
                    <table class="catalogue-table">
                        <tbody>
                            <tr>
                                <td class="cover"><img src="xml-bible.jpg" alt="XML Bible cover"></td>
                                <td class="details">
                                    Book: XMLBible<br>
                                    Author: Winston<br>
                                    Publication: Wiely
                                </td>
                                <td class="price">$40.5</td>
                                <td class="cart"><button class="add-cart-btn">🛒 Add to cart</button></td>
                            </tr>
                            <tr>
                                <td class="cover"><img src="ai-modern-approach.jpg" alt="AI: A Modern Approach cover">
                                </td>
                                <td class="details">
                                    Book: AI<br>
                                    Author: S.Russel<br>
                                    Publication: Princetonhall
                                </td>
                                <td class="price">$63</td>
                                <td class="cart"><button class="add-cart-btn">🛒 Add to cart</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </body>

</html>
